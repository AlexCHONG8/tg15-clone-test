<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Escanear — Verificación T.G.</title>
<meta name="robots" content="noindex,nofollow" />
<link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet" />
<link rel="icon" href="../vademecum/public/img/isologo26_90x90px.png" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Roboto', Arial, sans-serif;
    background: #14181c; color: #fff;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .top {
    padding: 14px 18px; display: flex; align-items: center; gap: 10px;
    background: rgba(20,24,28,.9); z-index: 3;
  }
  .top img { width: 28px; height: 28px; }
  .top .t { font-size: 15px; font-weight: 700; }
  .stage { flex: 1; position: relative; }
  video { width: 100%; height: 100%; object-fit: cover; }
  .frame {
    position: absolute; top: 50%; left: 50%;
    width: min(72vw, 300px); height: min(72vw, 300px);
    transform: translate(-50%, -50%);
    border-radius: 20px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,.45);
    pointer-events: none;
  }
  .frame::before, .frame::after, .frame i::before, .frame i::after {
    content: ''; position: absolute; width: 36px; height: 36px;
    border: 4px solid #f59c1a;
  }
  .frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 18px 0 0 0; }
  .frame::after  { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 18px 0 0; }
  .frame i::before { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 18px; }
  .frame i::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 18px 0; }
  .hint {
    position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
    font-size: 14px; font-weight: 500; color: #e8eaec; z-index: 2;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .hint small { display: block; margin-top: 4px; font-size: 11px; color: #aab3ba; }
  .msg {
    position: absolute; inset: 0; z-index: 5;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #14181c; padding: 30px; text-align: center;
  }
  .msg.show { display: flex; }
  .msg h2 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .msg p { font-size: 13px; color: #aab3ba; line-height: 1.6; }
  .msg .btn {
    margin-top: 18px; background: #ab8b07; color: #fff; border: none;
    padding: 12px 26px; border-radius: 10px; font-size: 14px; font-weight: 700;
    font-family: inherit;
  }
  .toast {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: #2d353c; border-left: 4px solid #f59c1a;
    padding: 10px 16px; border-radius: 8px; font-size: 12px; max-width: 85%;
    z-index: 6; display: none; word-break: break-all;
  }
</style>
</head>
<body>
  <div class="top">
    <img src="../vademecum/public/img/isologo26_90x90px.png" alt="" />
    <span class="t">Escanear código del producto</span>
  </div>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <div class="frame"><i></i></div>
    <div class="hint">Apunte al código QR del envase<small>T.G. — Tirzepatida · Indufar CISA</small></div>
    <div class="toast" id="toast"></div>

    <div class="msg" id="denied">
      <h2>Cámara bloqueada</h2>
      <p>Permita el acceso a la cámara para escanear el código de verificación.</p>
      <button class="btn" onclick="location.reload()">Reintentar</button>
    </div>
    <div class="msg" id="nocam">
      <h2>Sin cámara disponible</h2>
      <p>Este dispositivo o navegador no expone una cámara utilizable.</p>
      <button class="btn" onclick="location.href='verificar.html'">Ir a verificación</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
(function () {
  var video = document.getElementById('video');
  var toast = document.getElementById('toast');
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var running = false;

  function showToast(text) {
    toast.textContent = text;
    toast.style.display = 'block';
    setTimeout(function () { toast.style.display = 'none'; }, 2500);
  }

  function handleContent(text) {
    var m = text.match(/[?&]lote=([^&#?]+)/i);
    if (m) {
      if (navigator.vibrate) navigator.vibrate(80);
      location.href = 'verificar.html?lote=' + encodeURIComponent(m[1]);
      return;
    }
    if (/^https?:\/\//i.test(text)) {
      if (navigator.vibrate) navigator.vibrate(80);
      location.href = text;
      return;
    }
    showToast('Código sin lote: ' + text.slice(0, 60));
  }

  function tick() {
    if (!running) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      if (canvas.width !== video.videoWidth) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      ctx.drawImage(video, 0, 0);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) { handleContent(code.data); return; }
    }
    requestAnimationFrame(tick);
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function (stream) {
      video.srcObject = stream;
      video.setAttribute('playsinline', 'true');
      video.play();
      running = true;
      requestAnimationFrame(tick);
    })
    .catch(function (err) {
      var denied = err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError');
      document.getElementById(denied ? 'denied' : 'nocam').classList.add('show');
    });
})();
</script>
</body>
</html>
